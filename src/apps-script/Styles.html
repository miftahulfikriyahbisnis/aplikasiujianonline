<style>
  :root {
    --primary: #1F4E78;
    --primary-dark: #163A5C;
    --background: #F4F7FA;
    --surface: #FFFFFF;
    --text: #17202A;
    --secondary: #5F6B76;
    --success: #1F7A4C;
    --warning: #B7791F;
    --danger: #B42318;
    --focus: #2F80ED;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  body { background-color: var(--background); color: var(--text); min-height: 100vh; }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(31,78,120,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #E2E8F0; color: var(--text); }
  .btn-secondary:hover { background: #CBD5E1; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #911A10; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
  .badge-success { background: #E8F5E9; color: var(--success); }
  .badge-warning { background: #FEF3C7; color: var(--warning); }
  .badge-danger { background: #FEE2E2; color: var(--danger); }
  .badge-info { background: #E0F2FE; color: var(--primary); }
</style>
